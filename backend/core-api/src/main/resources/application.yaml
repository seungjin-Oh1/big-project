spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: bigproject
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bigproject}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  ai-api:
    base-url: ${AI_API_URL:http://localhost:8001}
  jwt:
    # 개발용 기본값 — 운영 배포 전 반드시 JWT_SECRET 환경변수로 교체할 것 (32바이트 이상)
    secret: ${JWT_SECRET:dev-only-secret-key-please-change-in-production-32bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  s3:
    bucket: ${AWS_S3_BUCKET:aivle-test-ai-34178924}
    region: ${AWS_S3_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}