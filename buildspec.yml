# AWS CodeBuild가 실행하는 빌드 정의.
#
# 파이프라인 구성
#   Source  GitHub (CodeConnections)
#   Build   이 파일 — 테스트 4종 + 이미지 4개 빌드
#   Deploy  (EC2가 생긴 뒤 추가)
#
# 왜 도커 이미지를 여기서 빌드하나
#   EC2에서 빌드하면 12GB에 가까운 패키지를 NAT로 내려받아야 하고(데이터 요금)
#   t3.xlarge에서 20분이 걸린다. 그동안 인스턴스와 NAT는 계속 과금된다.
#   여기서 구워 ECR에 올려두면 EC2는 pull만 하면 되므로 유료 구간이 짧아진다.
#
# 필요한 환경변수 (CodeBuild 프로젝트에 설정)
#   AWS_ACCOUNT_ID   ECR 주소를 만드는 데 쓴다
#   AWS_DEFAULT_REGION  ap-northeast-2
#   PUSH_IMAGES      "true"일 때만 이미지를 굽고 ECR에 올린다. 기본은 테스트만 한다.
#                    CodeBuild는 분당 과금이고 이미지 빌드가 회차의 대부분(20분 중 12분)을
#                    차지한다. 커밋마다 배포하는 것도 아닌데 매번 구울 이유가 없다.
#                    배포할 때만 켠다. (ECR 저장도 GB당 월 0.10달러, 이미지 4개면 약 12GB)
#
# CodeBuild 프로젝트에서 "권한이 있는(privileged) 모드"를 켜야 한다.
# 도커 데몬을 쓰려면 필요하고, 안 켜면 docker build가 소켓을 못 찾는다.

version: 0.2

env:
  variables:
    # 러너에 GPU가 없다. 기본 torch는 CUDA 빌드라 쓰지도 않을 몇 GB를 받는다.
    TORCH_INDEX: "https://download.pytorch.org/whl/cpu"
    PUSH_IMAGES: "false"

phases:
  install:
    runtime-versions:
      python: 3.12
      java: corretto17
      nodejs: 22

  pre_build:
    commands:
      - |
        echo "=== 테스트 준비 ==="

        # 로컬 캐시를 켠 뒤로 빌드 호스트가 재사용된다. 그래서 지난 회차의
        # 컨테이너가 그대로 남아 이름이 충돌한다("name is already in use").
        # 매번 지우고 시작한다. 없으면 그냥 넘어간다.
        docker rm -f ci-postgres >/dev/null 2>&1 || true

        # Postgres를 컨테이너로 띄운다. core-api 테스트가 실제로 DB에 붙는다
        # (H2로 바꾸면 JSONB와 text[]가 안 맞는다).
        docker run -d --name ci-postgres -p 5432:5432 \
          -e POSTGRES_DB=bigproject \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          postgres:16

        for i in $(seq 1 30); do
          docker exec ci-postgres pg_isready -U postgres && break
          echo "postgres 기다리는 중... ($i)"; sleep 2
        done

  build:
    commands:
      # 한 블록으로 묶는다. 항목을 나누면 셸이 갈려서 export한 값이 다음 항목까지
      # 안 간다(post_build에서 실제로 겪었다).
      - |
        echo "=== ai-api 테스트 ==="
        cd backend/ai-api

        # app/ai/config.py가 import 시점에 이 둘을 요구한다(_require_env). 없으면
        # 테스트가 돌기도 전에 수집 단계에서 9개 파일이 통째로 깨진다.
        # 진짜 키를 CI에 둘 수는 없으니 형식만 맞는 가짜 값을 넣는다. 외부를 실제로
        # 치는 테스트는 아래 --ignore로 빠져 있어서 이 값이 쓰일 일은 없다.
        export OPENAI_API_KEY=sk-ci-dummy-not-a-real-key
        export S3_BUCKET_NAME=ci-dummy-bucket

        pip install -q torch==2.13.0 --index-url "$TORCH_INDEX"
        pip install -q -r requirements.txt
        # pytest는 requirements.txt에 없다. 운영 이미지에 테스트 도구를 넣지 않으려는
        # 것인데, 그러다 보니 CI에서 "No module named pytest"로 죽었다. 여기서 깐다.
        pip install -q pytest

        # 살아 있는 색인·외부 API를 치는 것들은 뺀다. 느리고, 외부 사정으로
        # 실패하면 빌드를 막는다.
        #
        # test_forms_api_integration은 이름 그대로 실제 로컬 RAG 색인을 친다.
        # Chroma 색인(storage/)은 용량 때문에 git에 없고 배포 때 S3에서 받으므로
        # CI 러너에는 존재하지 않는다. 그 상태로 돌리면 후보가 0개라 반드시
        # 실패한다. 파일 안에 이 테스트 하나뿐이라 파일째 뺀다.
        python -m pytest tests/ -q \
          --ignore=tests/test_form_retrieval_quality.py \
          --ignore=tests/test_form_search_accuracy.py \
          --ignore=tests/test_evaluate_precedent_retrieval.py \
          --ignore=tests/test_forms_api_integration.py
      - cd $CODEBUILD_SRC_DIR

      - echo "=== core-api 테스트 ==="
      - cd backend/core-api
      - chmod +x gradlew
      - DB_URL=jdbc:postgresql://localhost:5432/bigproject
        DB_USERNAME=postgres DB_PASSWORD=postgres
        SPRING_PROFILES_ACTIVE=test
        ./gradlew test --no-daemon --console=plain
      - cd $CODEBUILD_SRC_DIR

      - echo "=== frontend 린트·빌드 ==="
      - cd frontend
      - npm ci
      - npm run lint
      - npm run build
      - cd $CODEBUILD_SRC_DIR

      # 이미지는 배포할 때만 굽는다. 평소 커밋에서는 위 테스트까지가 목적이고,
      # 굽기만 하고 버리는 12분을 분당 요금으로 낼 이유가 없다.
      - |
        if [ "$PUSH_IMAGES" != "true" ]; then
          echo "=== 이미지 빌드 건너뜀 (PUSH_IMAGES=$PUSH_IMAGES) ==="
          echo "배포할 때 PUSH_IMAGES=true로 재실행하면 굽고 ECR까지 올립니다."
        else
          echo "=== 이미지 빌드 ==="
          docker build -t bigproject-core-api           backend/core-api
          docker build -t bigproject-ai-api             backend/ai-api
          docker build -t bigproject-stt-mask-api-modal backend/stt-mask-api-modal
          docker build -t bigproject-frontend           frontend
        fi

  post_build:
    # 전체를 한 블록으로 묶는다. CodeBuild는 commands의 항목을 각각 별도 셸로
    # 돌린다. 그래서 항목 하나에서 exit 0을 해도 다음 항목이 그대로 이어졌고,
    # 푸시를 건너뛴다고 찍어놓고 바로 아래에서 ECR 로그인을 시도해 실패했다.
    # 같은 이유로 REGISTRY 같은 변수도 항목 사이에 살아남지 않는다.
    commands:
      - |
        if [ "$PUSH_IMAGES" != "true" ]; then
          echo "PUSH_IMAGES가 true가 아닙니다. 이미지가 없으므로 푸시할 것도 없습니다."
          exit 0
        fi

        if [ -z "$AWS_ACCOUNT_ID" ]; then
          echo "AWS_ACCOUNT_ID가 비어 있습니다. CodeBuild 프로젝트 환경변수에 넣어야 합니다."
          exit 1
        fi

        echo "=== ECR 푸시 ==="
        REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
        aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
          | docker login --username AWS --password-stdin "$REGISTRY"

        for name in core-api ai-api stt-mask-api-modal frontend; do
          repo="bigproject-$name"
          # 저장소가 없으면 만든다. 콘솔에서 미리 만들어 두지 않아도 되게.
          aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$repo" >/dev/null
          # 커밋 해시로도 태그를 단다. latest만 쓰면 어느 커밋이 올라간 건지
          # 알 수 없고, 문제가 생겼을 때 되돌릴 지점도 없다.
          docker tag "bigproject-$name" "$REGISTRY/$repo:latest"
          docker tag "bigproject-$name" "$REGISTRY/$repo:$CODEBUILD_RESOLVED_SOURCE_VERSION"
          docker push "$REGISTRY/$repo:latest"
          docker push "$REGISTRY/$repo:$CODEBUILD_RESOLVED_SOURCE_VERSION"
        done

cache:
  paths:
    - '/root/.gradle/**/*'
    - '/root/.cache/pip/**/*'
    - 'frontend/node_modules/**/*'
