# PR을 열거나 master에 밀 때 도는 검사.
#
# 왜 만들었나 —
# 기여자 8명에 커밋 300개가 넘는데 자동 검사가 하나도 없었다. ai-api에 테스트가
# 324개 있지만 아무도 돌리지 않고, core-api는 테스트 클래스가 3개뿐이라 더 취약하다.
#
# 실제로 2026-08-11에 받은 PR이 세 번 연속 기동에 실패했다.
#   static/ 폴더가 커밋에서 빠짐        → RuntimeError
#   .env 없으면 os.environ[...]가 KeyError → 기동 불가
#   requirements.txt에 accelerate 누락    → ValueError
# 셋 다 "import만 해봐도" 걸리는 문제였고, 아래 docker-build 잡이 전부 잡는다.
#
# 배포 비용과도 관계가 있다. EC2와 NAT Gateway는 켜는 순간부터 시간당 과금이라,
# 그 위에서 빌드가 깨지면 고치는 시간만큼 돈이 나간다. 여기서 미리 걸러 두면
# 유료 구간을 짧게 지나갈 수 있다.

name: CI

on:
  pull_request:
  push:
    branches: [master]

# 같은 브랜치에 연달아 밀면 앞의 실행을 취소한다. 무료 사용량을 아끼고,
# 어차피 최신 커밋 결과만 보면 된다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-api:
    name: ai-api 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13/3.14에서는 일부 의존성이 설치되지 않는다(CLAUDE.md).
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/ai-api/requirements.txt

      - name: 의존성 설치
        working-directory: backend/ai-api
        # GPU가 없는 러너다. 기본 torch는 CUDA 빌드라 몇 GB를 받는데 쓰지 않는다.
        run: |
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: pytest
        working-directory: backend/ai-api
        # 살아 있는 색인·외부 API를 치는 세 개는 뺀다(CLAUDE.md). 느리고,
        # 외부 사정으로 실패하면 PR을 막게 된다.
        #
        # 나머지는 실제 키가 없어도 돈다 — 테스트가 monkeypatch로 가짜 키를 넣는다.
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_form_retrieval_quality.py \
            --ignore=tests/test_form_search_accuracy.py \
            --ignore=tests/test_evaluate_precedent_retrieval.py

  core-api:
    name: core-api 테스트
    runs-on: ubuntu-latest

    # application.yaml이 로컬 Postgres를 기본값으로 본다. 테스트가 실제로
    # 연결하므로 DB를 띄워 준다(H2로 바꾸면 JSONB·text[]가 안 맞는다).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bigproject
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: gradlew 실행 권한
        working-directory: backend/core-api
        run: chmod +x gradlew

      - name: 테스트
        working-directory: backend/core-api
        env:
          DB_URL: jdbc:postgresql://localhost:5432/bigproject
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          # 개발용 기본값을 그대로 둔다. DevSecretGuard는 local/test 프로파일에서
          # 경고만 하고 통과시킨다 — 여기서 진짜 시크릿을 쓸 이유가 없다.
          SPRING_PROFILES_ACTIVE: test
        run: ./gradlew test --no-daemon

  frontend:
    name: frontend 린트·빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 설치
        working-directory: frontend
        run: npm ci

      - name: 린트
        working-directory: frontend
        run: npm run lint

      - name: 빌드
        working-directory: frontend
        run: npm run build

  docker-build:
    name: 이미지 빌드
    runs-on: ubuntu-latest
    # 서비스 하나가 깨져도 나머지 결과를 봐야 한다. 어디가 문제인지 한 번에 안다.
    strategy:
      fail-fast: false
      matrix:
        service:
          - core-api
          - ai-api
          - stt-mask-api-modal
          - frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: ${{ matrix.service }} 빌드
        uses: docker/build-push-action@v6
        with:
          # frontend만 레포 최상위가 아니라 frontend/ 아래에 있다.
          context: ${{ matrix.service == 'frontend' && 'frontend' || format('backend/{0}', matrix.service) }}
          # 레지스트리에 밀지 않는다. "빌드가 되는가"만 본다 —
          # 배포는 수동이고, 밀면 ECR 보관 요금이 붙는다.
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
